# The Whitechain ERC-4337 contracts and their tests. This file is separate, so foundry.toml and the
# EIP-8141 build do not change. The tests run on osaka because forge has no P-256 precompile at
# 0x100 on prague. The deploy build stays prague, in hardhat.whitechain.config.ts. Whitechain Sepolia
# has the precompile.
#
#   FOUNDRY_CONFIG=foundry.whitechain.toml forge test
[profile.default]
src = "whitechain/src"
test = "whitechain/test"
out = "out-forge-wc"
cache_path = "cache-forge-wc"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@account-abstraction/contracts/=node_modules/@account-abstraction/contracts/",
  "solady/=node_modules/solady/",
]
