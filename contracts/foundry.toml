# Forge tests only WavePolicy, which has no frame opcodes. Hardhat with the solc fork builds the
# rest. `src` points at the tests, so forge compiles only what the tests import.
[profile.default]
src = "test"
test = "test"
out = "out-forge"
cache_path = "cache-forge"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
